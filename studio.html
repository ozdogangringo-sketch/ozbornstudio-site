    .status-bar {

    .ust-baslik {

    }
    .geri-btn {

      height: 34px;
      border-radius: 17px;
      background: #EFECE6;

      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      color: #22242C;
      flex-shrink: 0;

    .ust-metin { flex: 1; min-width: 0; }
    .ust-baslik-yazi { font-size: 18px; font-weight: 800; letter-spacing: -0.3px; color: #22242C; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ust-alt-yazi { font-size: 12px; font-weight: 500; color: #6A6F7D; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .satir-alt { font-size: 12px; font-weight: 500; color: #6A6F7D; line-height: 1.35; }

    .rozet {
      display: inline-flex;

      gap: 4px;
      padding: 4px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;

    .ton-vurgu { background: #EEEBFF; color: #6C5CE7; }
    .ton-nane { background: #E3F5EC; color: #2F9E77; }
    .ton-seftali { background: #FDEEE2; color: #E07B39; }

    .ton-gul { background: #FCE7ED; color: #D9486E; }

    .sekme-cubugu {

      bottom: 0;
      left: 0;
      right: 0;

      align-items: center;

      border: none;
      background: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      color: #9CA1AD;
      cursor: pointer;

    .sekme-arti {

      height: 42px;
      border-radius: 21px;
      background: #6C5CE7;
      color: #FFF;

      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 700;
      margin-top: -14px;
      box-shadow: 0 6px 14px rgba(108,92,231,0.35);
      border: 3px solid #F6F4F0;
    }

    .alt-cubuk {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: #FFFFFF;
      border-top: 1px solid #ECE7E1;
      padding: 10px 16px 12px;
      display: flex;
      gap: 8px;
      z-index: 25;
      box-shadow: 0 -4px 16px rgba(34,36,44,0.06);
    }

    .perde {
      position: absolute;
      inset: 0;
      background: rgba(20, 22, 28, 0.45);
      z-index: 40;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }
    .alt-pencere {
      background: #F6F4F0;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      max-height: 84%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 -10px 30px rgba(0,0,0,0.18);
    }
    .tutamak {
      width: 38px;
      height: 4px;
      border-radius: 2px;
      background: #DDD6CC;
      margin: 10px auto 6px;
      flex-shrink: 0;
    }
    .pencere-icerik {
      padding: 10px 18px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .bildirim {
      position: absolute;
      top: 30px;
      left: 16px;
      right: 16px;
      background: #22242C;
      color: #FFF;
      padding: 10px 14px;
      border-radius: 13px;
      font-size: 12px;
      font-weight: 700;
      z-index: 60;
      display: none;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 8px 24px rgba(0,0,0,0.22);

    input, textarea {
      width: 100%;
      font-family: inherit;
      font-size: 13px;
      color: #22242C;
      background: #FFFFFF;
      border: 1px solid #DDD6CC;
      border-radius: 12px;
      padding: 9px 12px;
      outline: none;
    }
    input:focus, textarea:focus { border-color: #6C5CE7; }
  </style>
</head>

  <script>
    const durum = {
      ekran: 'onay',

      editorSekme: 'metin',
      kasaSekme: 'anahtarlar',
      asistanSekme: 'sohbet',
      seciliEntegrasyonId: 'tiktok',

      akis45: false,

      tiktokBagli: true,

        TIKTOK_CLIENT_KEY: '••••••••8f2a',
        TIKTOK_ACCESS_TOKEN: '••••••••90b1',
        IG_ACCESS_TOKEN: '••••••••9a4f',
        THREADS_ACCESS_TOKEN: '••••••••5b82',

      },

        { id: 1, kat: 'Yazım & Üslup', ton: 'ton-vurgu', kural: 'Tık tuzağı ("Şok gelişme", "Bakın ne oldu") kesinlikle yasak; ilk cümlede somut bilgi verilir.', yanlis: 'Merkez Bankası’ndan piyasaları sarsan karar!', dogru: 'Merkez Bankası politika faizini %45 seviyesinde sabit tuttu.' },
        { id: 2, kat: 'Haber Seçimi & Puan', ton: 'ton-limon', kural: 'Yerel adli vakalar ulusal etki taşımıyorsa en fazla 5/10 alır ve son dakika olmaz.', yanlis: 'Mahallede kavga: 9/10', dogru: '5/10 (Normal havuz)' },
        { id: 3, kat: 'Kesin Yasak', ton: 'ton-gul', kural: 'Kaynak metinde açıkça geçmeyen hiçbir rakam veya tahmin slayta eklenmez.', dogru: 'Yalnızca resmi bültendeki oranlar yazılır.' },
      ],
      mesajlar: [
        { kim: 'ben', metin: 'Bugün neden öğleden sonra tekil son dakika çıkmadı?' },
        {
          kim: 'asistan',
          arac: 'Köprü özeti + Proje Hafızası okundu',
          metin: 'Havuzdaki son haberlerde en yüksek puan 7/10 (“Cari denge fazla verdi”). Son dakika eşiği 8/10 olduğu için 10’lu tura ayrıldı. İstersen eşiği 7’ye çekebilirim:',
          onayKarti: { baslik: 'Son dakika puan eşiğini güncelle', alt: 'DailyBrief · genel.son_dakika_puan_esigi (8 → 7)', durum: 'bekliyor' }
        }
      ],
      seciliSablon: 'haber',
      sablonAd: 'TechBrief TR',
      sablonHesap: '@techbrief.tr'
    };

    const ENTEGRASYONLAR = {
      tiktok: { id: 'tiktok', ad: 'TikTok Content Posting API', grup: 'sosyal', ikon: '♪', ton: 'ton-vurgu', hesap: '@dailybrief.co', kalan: 'Yetkili', kota: 'Direct Post & Upload API', not: 'Access Token (24 sa) otomatik yenilenir; Refresh Token 365 gün geçerlidir.', anahtarlar: ['TIKTOK_CLIENT_KEY', 'TIKTOK_ACCESS_TOKEN'], rehber: ['developers.tiktok.com → OzBorn Studio uygulamasını aç.', 'Login Kit (user.info.basic) ve Content Posting API (video.publish, video.upload) ekle.', 'Redirect URI olarak https://ozbornstudio.com/auth/tiktok/callback tanımla.'] },
      meta: { id: 'meta', ad: 'Instagram & Facebook (Meta)', grup: 'sosyal', ikon: '📸', ton: 'ton-nane', hesap: '@dailybrief.co · @ezanplus', kalan: 'Süresiz', kota: 'Bugün 6/100 yayın', not: 'Süresiz Sayfa Jetonu (Page Token). Süre sınırı yoktur.', anahtarlar: ['IG_ACCESS_TOKEN'], rehber: ['Graph API Explorer üzerinden Page Access Token üret.', 'Extend Access Token ile süresiz sayfa jetonuna dönüştür.'] },
      threads: { id: 'threads', ad: 'Threads API', grup: 'sosyal', ikon: '@', ton: 'ton-limon', hesap: '@dailybrief.co', kalan: '9 gün', kota: 'Otomatik yenilenir', not: '60 günlük jeton · Pazartesi 12:07 bakımında otomatik yenilenir.', anahtarlar: ['THREADS_ACCESS_TOKEN'], rehber: ['Meta Developer panelinde Threads API izinleriyle 60 günlük jeton üret.'] },
      github: { id: 'github', ad: 'GitHub PAT & Worker Dispatch', grup: 'altyapi', ikon: '⚙️', ton: 'ton-limon', hesap: 'ozdogangringo-sketch', kalan: '14 gün', kota: 'Actions & Secrets', not: 'Worker GITHUB_PAT 14 gün sonra doluyor. Dolarsa onay düğmeleri durur.', anahtarlar: ['GITHUB_PAT'], rehber: ['GitHub Settings → Fine-grained tokens → Actions & Secrets (Read/Write) izni ver.'] },
      gemini: { id: 'gemini', ad: 'Google Gemini 2.0 Flash', grup: 'yapay_zeka', ikon: '✨', ton: 'ton-nane', hesap: 'Google AI Studio', kalan: 'Geçerli', kota: '27/40 günlük istek', not: 'Ücretsiz kota + Faturalı yedek anahtar ($1,81 bu ay).', anahtarlar: ['GEMINI_API_KEY'], rehber: ['aistudio.google.com/apikey üzerinden anahtar oluştur ve kasaya kaydet.'] },
    };

    function bildir(metin) {
      const el = document.getElementById('toast');
      document.getElementById('toast-metin').textContent = metin;
      el.style.display = 'flex';
      clearTimeout(window._t);
      window._t = setTimeout(() => { el.style.display = 'none'; }, 2400);
    }
    const bildirim = bildir;

    function ekranAc(e) {
      durum.ekran = e;
      durum.pencere = null;
      ['merkez', 'onay', 'kasa', 'asistan', 'sablon'].forEach(k => {
        const b = document.getElementById('q-' + k);
        if (b) b.classList.toggle('active', k === e);
      });
      ciz();
      document.getElementById('icerik-alan').scrollTop = 0;
    }

    function kanalSec(k) {
      const y = !durum.kanallar[k];
      durum.kanallar[k] = y;
      if (k === 'ig' && y) durum.kanallar.reels = false;
      if (k === 'reels' && y) durum.kanallar.ig = false;
      if (k === 'tt' && y) durum.kanallar.ttvideo = false;
      if (k === 'ttvideo' && y) durum.kanallar.tt = false;
      ciz();
    }

    function ustBaslikCiz(baslik, alt, geriEkrani, sagHtml = '') {
      return `
        <div class="ust-baslik">
          ${geriEkrani ? `<button class="geri-btn" onclick="ekranAc('${geriEkrani}')">‹</button>` : ''}
          <div class="ust-metin">
            <div class="ust-baslik-yazi">${baslik}</div>
            ${alt ? `<div class="ust-alt-yazi">${alt}</div>` : ''}
          </div>
          ${sagHtml}
        </div>
      `;
    }

    function sekmeCubuguCiz(aktif) {
      return `
        <div class="sekme-cubugu">
          <button class="sekme-btn ${aktif==='merkez'?'aktif':''}" onclick="ekranAc('merkez')">
            <span style="font-size:16px">⌂</span><span>Merkez</span>
          </button>
          <button class="sekme-btn ${aktif==='onay'?'aktif':''}" onclick="ekranAc('onay')">
            <span style="font-size:16px">📥</span><span>Onaylar</span>
          </button>
          <button class="sekme-btn ${aktif==='sablon'?'aktif':''}" onclick="ekranAc('sablon')">
            <div class="sekme-arti">＋</div><span>Oluştur</span>
          </button>
          <button class="sekme-btn ${aktif==='asistan'?'aktif':''}" onclick="ekranAc('asistan')">
            <span style="font-size:16px">✨</span><span>Asistan</span>
          </button>
          <button class="sekme-btn ${aktif==='kasa'?'aktif':''}" onclick="ekranAc('kasa')">
            <span style="font-size:16px">⚙️</span><span>Ayarlar</span>
          </button>
        </div>
      `;
    }

    function cizMerkez() {
      document.getElementById('ust-alan').innerHTML = ustBaslikCiz('Merhaba Doğukan', 'Salı · 3 proje aktif', null, `<span class="rozet ton-nane">Köprü Canlı</span>`);
      document.getElementById('alt-alan').innerHTML = sekmeCubuguCiz('merkez');
      document.getElementById('icerik-alan').innerHTML = `
        <div class="kart" style="background:#E3F5EC;border-color:#C6EAD8;display:flex;align-items:center;gap:12px">
          <div class="ikon-kutu ton-nane" style="background:#FFF">✓</div>
          <div class="satir-orta">
            <div class="satir-baslik" style="color:#1B654C">Her şey yolunda</div>
            <div class="satir-alt" style="color:#2F9E77">DailyBrief 12 dk önce konuştu · 3.473 haber havuzda</div>
          </div>
        </div>

        <div class="bolum">

      durum.mesajlar.push({
        kim: 'asistan',
        arac: 'Gemini 2.0 Flash · Canlı Özet',
        metin: `“${v}” talimatını değerlendirdim. İstersen bunu kalıcı Proje Hafızası kuralı olarak kaydedebilirim.`
      });
      ciz();
    }

    function cizSablon() {
      document.getElementById('ust-alan').innerHTML = ustBaslikCiz('Şablondan Yeni Bot', 'Modül 4 · Sıfırdan kod yazmadan yeni proje kur', 'merkez');
      document.getElementById('alt-alan').innerHTML = sekmeCubuguCiz('sablon');

      const sablonlar = [
        ['haber', '📰', 'ton-gok', 'Haber & Gündem Botu (DailyBrief)', 'RSS havuzu · Gemini önem puanlama · 4 katmanlı doğrulama'],
        ['koleksiyon', '🕌', 'ton-nane', 'Günlük Kart & Sesli Video (Ezan Plus)', 'Yerel veritabanı · Günlük zamanlama · Sesli Reels/Shorts'],
        ['sektor', '🏠', 'ton-seftali', 'Sektörel Bilgi & Konu Bankası (postEDM)', 'Konu bankası (S1-S6) + Sektörel RSS haberleri']
      ];

      document.getElementById('icerik-alan').innerHTML = `
        <div class="bolum">
          <div class="bolum-ust"><span class="bolum-baslik">1. Algoritma şablonunu seç</span></div>
          <div class="kart-liste">
            ${sablonlar.map(([id, ik, ton, ad, alt]) => `
              <div class="satir" onclick="durum.seciliSablon='${id}';ciz()">
                <div class="ikon-kutu ${ton}">${ik}</div>
                <div class="satir-orta">
                  <div class="satir-baslik">${ad}</div>
                  <div class="satir-alt">${alt}</div>
                </div>
                ${durum.seciliSablon === id ? `<span class="rozet ton-vurgu">✓ Seçili</span>` : ''}
              </div>
            `).join('')}
          </div>
        </div>

        <div class="bolum">
          <div class="bolum-ust"><span class="bolum-baslik">2. Kimlik ve Hedef Kanallar</span></div>
          <div class="kart" style="display:flex;flex-direction:column;gap:10px">
            <div style="display:flex;flex-direction:column;gap:4px">
              <span style="font-size:12px;font-weight:700;color:#6A6F7D">Proje Adı</span>
              <input value="${durum.sablonAd}" oninput="durum.sablonAd=this.value" />
            </div>
            <div style="display:flex;flex-direction:column;gap:4px">
              <span style="font-size:12px;font-weight:700;color:#6A6F7D">Sosyal Medya Hesabı</span>
              <input value="${durum.sablonHesap}" oninput="durum.sablonHesap=this.value" />
            </div>
            <div style="display:flex;flex-wrap:wrap;gap:6px;padding-top:2px">
              <span class="cip secili">✓ Instagram</span>
              <span class="cip secili">✓ TikTok Direct Post</span>
              <span class="cip secili">✓ Threads</span>
              <span class="cip">YouTube Shorts</span>
            </div>
            <button class="dugme dugme-birincil" onclick="bildir(durum.sablonAd + ' şablon yapılandırması oluşturuldu!')">✨ Şablon Yapılandırmasını Oluştur</button>
          </div>
        </div>
      `;
    }

    function pencereCiz() {
      const p = durum.pencere;
      if (!p) {
        document.getElementById('pencere-alan').innerHTML = '';
        return;
      }

      let baslik = '';
      let alt = '';
      let icerik = '';

      if (p === 'editor') {
        baslik = 'İçerik ve Yerleşim Editörü';
        alt = 'Kaydedince slaytlar seçtiğin metin ve yerleşimle yeniden çizilir (~1 dk)';
        icerik = `
          <div class="segment">
            <button class="segment-oge ${durum.editorSekme==='metin'?'secili':''}" onclick="durum.editorSekme='metin';pencereCiz()">Metin ve Açıklama</button>
            <button class="segment-oge ${durum.editorSekme==='yerlesim'?'secili':''}" onclick="durum.editorSekme='yerlesim';pencereCiz()">Slayt Yerleşimi</button>
          </div>

          ${durum.editorSekme === 'metin' ? `
            <div style="display:flex;flex-direction:column;gap:10px">
              <div>
                <div style="font-size:12px;font-weight:700;color:#6A6F7D;margin-bottom:4px">Başlık</div>
                <textarea rows="2" oninput="durum.baslik=this.value">${durum.baslik}</textarea>
              </div>
              <div>
                <div style="font-size:12px;font-weight:700;color:#6A6F7D;margin-bottom:4px">Özet (alt metin)</div>
                <textarea rows="2" oninput="durum.ozet=this.value">${durum.ozet}</textarea>
              </div>
              <div>
                <div style="font-size:12px;font-weight:700;color:#6A6F7D;margin-bottom:4px">Paylaşım açıklaması (Instagram / TikTok)</div>
                <textarea rows="3" oninput="durum.aciklama=this.value">${durum.aciklama}</textarea>
              </div>
            </div>
          ` : `
            <div style="display:flex;flex-direction:column;gap:12px">
              <div>
                <div style="font-size:12px;font-weight:700;color:#6A6F7D;margin-bottom:6px">Başlık Bloğu Dikey Konumu</div>
                <div class="segment">
                  <button class="segment-oge ${durum.dikeyKonum==='yukari'?'secili':''}" onclick="durum.dikeyKonum='yukari';pencereCiz()">↑ Üst Bölge</button>
                  <button class="segment-oge ${durum.dikeyKonum==='orta'?'secili':''}" onclick="durum.dikeyKonum='orta';pencereCiz()">Orta (Varsayılan)</button>
                  <button class="segment-oge ${durum.dikeyKonum==='asagi'?'secili':''}" onclick="durum.dikeyKonum='asagi';pencereCiz()">↓ Alt Bölge</button>
                </div>
              </div>
              <div class="kart-liste">
                ${[
                  ['kanca', 'Kanca (Üst vurgu şeridi)', 'Slaytın tepesindeki kategori etiketi'],
                  ['ozet', 'Özet satırı', 'Başlığın altındaki açıklama cümlesi'],
                  ['vurgu', 'Sarı kelime vurgusu', 'Önemli kelimelerin renkli vurgulanması'],
                  ['alinti', 'Alıntı kutusu', 'Varsa konuşmacı alıntısı kartı']
                ].map(([k, ad, acik]) => `
                  <div class="satir" onclick="durum.elemanlar.${k}=!durum.elemanlar.${k};pencereCiz()">
                    <div class="satir-orta">
                      <div class="satir-baslik">${ad}</div>
                      <div class="satir-alt">${acik}</div>
                    </div>
                    <div class="anahtar ${durum.elemanlar[k]?'acik':''}"><div class="anahtar-top"></div></div>
                  </div>
                `).join('')}
              </div>
            </div>
          `}

          <button class="dugme dugme-birincil" onclick="durum.pencere=null;bildir('Metin ve yerleşim kaydedildi (metin_duzenle)');ciz()">✓ Kaydet ve yeniden çizdir</button>
        `;
      } else if (p === 'foto') {
        baslik = 'Slayt 1 için fotoğraf seç';
        alt = 'Seçtiğin adayla slayt yeniden çizilir (gorsel_sec:aday:1)';
        icerik = `
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
            ${[
              [1, 'Aday 1 (Haber Fotoğrafı)', '#1E3A8A'],
              [2, 'Aday 2 (Ajans Fotoğrafı)', '#4C1D95'],
              [3, 'Aday 3 (Pexels Temsili)', '#065F46'],
              [4, 'AI Kapak Görseli (~$0,04)', '#831843']
            ].map(([no, ad, renk]) => `
              <div onclick="durum.seciliAday=${no};pencereCiz()" style="padding:10px;border-radius:14px;background:#FFFFFF;border:2px solid ${durum.seciliAday===no?'#6C5CE7':'#ECE7E1'};cursor:pointer;text-align:center">
                <div style="height:80px;border-radius:10px;background:${renk};color:#FFF;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;margin-bottom:6px">Aday #${no}</div>
                <div style="font-size:11px;font-weight:700">${ad}</div>
              </div>
            `).join('')}
          </div>
          <button class="dugme dugme-birincil" onclick="durum.pencere=null;bildir('Aday #' + durum.seciliAday + ' seçildi (gorsel_sec)');ciz()">✓ Aday #${durum.seciliAday} Kullan</button>
        `;
      } else if (p === 'tiktok-oauth') {
        baslik = 'TikTok Login Kit · OAuth 2.0';
        alt = 'developers.tiktok.com · Content Posting API Yetkilendirmesi';
        icerik = `
          <div class="kart-liste">
            <div class="satir satir-statik">
              <div class="ikon-kutu ton-nane">👤</div>
              <div class="satir-orta">
                <div class="satir-baslik">user.info.basic</div>
                <div class="satir-alt">Hesap profil adı (@dailybrief.co) ve avatar doğrulaması</div>
              </div>
              <span class="rozet ton-nane">Onaylı</span>
            </div>
            <div class="satir satir-statik">
              <div class="ikon-kutu ton-vurgu">🚀</div>
              <div class="satir-orta">
                <div class="satir-baslik">video.publish</div>
                <div class="satir-alt">Direct Post API ile onaylanan içeriği doğrudan yayınlama</div>
              </div>
              <span class="rozet ton-vurgu">Direct Post</span>
            </div>
            <div class="satir satir-statik">
              <div class="ikon-kutu ton-gok">☁️</div>
              <div class="satir-orta">
                <div class="satir-baslik">video.upload</div>
                <div class="satir-alt">Taslak olarak TikTok gelen kutusuna medya yükleme</div>
              </div>
              <span class="rozet ton-gok">Upload</span>
            </div>
          </div>
          <div style="font-size:11px;color:#6A6F7D;background:#EFECE6;padding:10px;border-radius:12px">
            <strong>Redirect URI:</strong> https://ozbornstudio.com/auth/tiktok/callback
          </div>
          <button class="dugme dugme-birincil" onclick="durum.tiktokBagli=true;durum.pencere=null;bildir('TikTok hesabı (@dailybrief.co) OAuth 2.0 ile yetkilendirildi');ciz()">✓ Authorize & Continue with TikTok</button>
        `;
      } else if (p === 'entegrasyon') {
        const b = ENTEGRASYONLAR[durum.seciliEntegrasyonId];
        baslik = b.ad;
        alt = `${b.hesap} · ${b.kota}`;
        icerik = `
          <div class="segment">
            <button class="segment-oge ${durum.kasaSekme==='anahtarlar'?'secili':''}" onclick="durum.kasaSekme='anahtarlar';pencereCiz()">Anahtarlar</button>
            <button class="segment-oge ${durum.kasaSekme==='guncelle'?'secili':''}" onclick="durum.kasaSekme='guncelle';pencereCiz()">Jeton Yenile</button>
            <button class="segment-oge ${durum.kasaSekme==='rehber'?'secili':''}" onclick="durum.kasaSekme='rehber';pencereCiz()">Nasıl Alınır?</button>
          </div>

          ${durum.kasaSekme === 'anahtarlar' ? `
            <div class="kart" style="background:#EFECE6;font-size:12px;color:#22242C">${b.not}</div>
            <div class="kart-liste">
              ${b.anahtarlar.map(kod => `
                <div class="satir" onclick="durum.seciliAnahtarKodu='${kod}';durum.kasaSekme='guncelle';pencereCiz()">
                  <div class="ikon-kutu ton-vurgu">🔑</div>
                  <div class="satir-orta">
                    <div class="satir-baslik">${kod}</div>
                    <div class="satir-alt">GitHub Secrets + SecureStore · Değiştirmek için dokun</div>
                  </div>
                  <span class="rozet ton-vurgu">${durum.maskeler[kod] || '••••••••9a4f'}</span>
                </div>
              `).join('')}
            </div>
          ` : durum.kasaSekme === 'guncelle' ? `
            <div style="display:flex;flex-direction:column;gap:10px">
              <div style="font-size:12px;color:#6A6F7D">Yeni <strong>${durum.seciliAnahtarKodu}</strong> değerini yapıştır. Tam değer hiçbir yerde gösterilmez; yalnızca son 4 hanesi saklanır:</div>
              <input id="yeni-anahtar-girdi" type="password" placeholder="Yeni jeton / anahtar değerini girin…" />
              <button class="dugme dugme-birincil" onclick="anahtarGuncelle()">🔒 Şifrele ve Kasaya Kaydet</button>
            </div>
          ` : `
            <div class="kart" style="display:flex;flex-direction:column;gap:10px">
              ${b.rehber.map((adim, i) => `
                <div style="display:flex;gap:10px;align-items:flex-start;font-size:12.5px">
                  <span class="rozet ton-vurgu">${i + 1}</span>
                  <span style="flex:1">${adim}</span>
                </div>
              `).join('')}
            </div>
          `}
        `;
      } else if (p === 'yeni-kural') {
        baslik = 'Bota Yeni Kural Öğret';
        alt = 'DailyBrief Kalıcı Proje Hafızası';
        icerik = `
          <div style="display:flex;flex-direction:column;gap:10px">
            <div>
              <div style="font-size:12px;font-weight:700;color:#6A6F7D;margin-bottom:4px">Kural / Talimat</div>
              <textarea id="kural-metin" rows="2" placeholder="ör. Ekonomi başlıklarında ünlem işareti kullanma, net rakamla başla."></textarea>
            </div>
            <div>
              <div style="font-size:12px;font-weight:700;color:#6A6F7D;margin-bottom:4px">Doğru Örnek</div>
              <input id="kural-dogru" placeholder="ör. Yıllık enflasyon %44,38 olarak açıklandı" />
            </div>
            <button class="dugme dugme-birincil" onclick="yeniKuralKaydet()">✓ Hafızaya Kaydet</button>
          </div>
        `;
      }

      document.getElementById('pencere-alan').innerHTML = `
        <div class="perde" onclick="if(event.target===this){durum.pencere=null;pencereCiz()}">
          <div class="alt-pencere">
            <div class="tutamak"></div>
            <div style="padding:4px 18px 8px;display:flex;justify-content:space-between;align-items:flex-start">
              <div>
                <div style="font-size:16px;font-weight:800">${baslik}</div>
                <div style="font-size:11.5px;color:#6A6F7D">${alt}</div>
              </div>
              <button class="geri-btn" style="width:28px;height:28px;font-size:13px" onclick="durum.pencere=null;pencereCiz()">✕</button>
            </div>
            <div class="pencere-icerik">${icerik}</div>
          </div>
        </div>
      `;
    }

    function anahtarGuncelle() {
      const el = document.getElementById('yeni-anahtar-girdi');
      const v = el ? el.value.trim() : '';
      if (!v) return;
      const son4 = v.slice(-4).padStart(4, '•');
      durum.maskeler[durum.seciliAnahtarKodu] = '••••••••' + son4;
      durum.kasaSekme = 'anahtarlar';
      bildir(durum.seciliAnahtarKodu + ' şifrelendi ve kasaya kaydedildi');
      ciz();
    }

    function yeniKuralKaydet() {
      const m = document.getElementById('kural-metin')?.value.trim();
      const d = document.getElementById('kural-dogru')?.value.trim();
      if (!m) return;
      durum.kurallar.unshift({ id: Date.now(), kat: 'Yazım & Üslup', ton: 'ton-vurgu', kural: m, dogru: d || 'Kural aktif' });
      durum.pencere = null;
      bildir('Yeni kural Proje Hafızasına eklendi');
      ciz();
    }

    function ciz() {
      if (durum.ekran === 'merkez') cizMerkez();
      else if (durum.ekran === 'onay') cizOnay();
      else if (durum.ekran === 'kasa') cizKasa();
      else if (durum.ekran === 'asistan') cizAsistan();
      else if (durum.ekran === 'sablon') cizSablon();
      pencereCiz();
    }

    ciz();
  </script>
</body>
</html>
